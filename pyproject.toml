[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dzcek-alignrsr_jd213"
version = "0.1.0"
description = "通过字符级与结构级特征识别对齐算法研究员·存储 IO 与计算的重叠的痕迹，给出密度与命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "dzcek" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://dzcek.github.io"
Repository = "https://github.com/dzcek/alignrsr_jd213"
Issues = "https://github.com/dzcek/alignrsr_jd213/issues"

[project.scripts]
alignrsr_jd213 = "alignrsr_jd213:main"

[tool.setuptools]
py-modules = ["alignrsr_jd213"]
